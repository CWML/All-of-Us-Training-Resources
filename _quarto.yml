project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - "pages/**/*.qmd"
    - "!Notes/"
  resources:
    - "/.nojekyll"
    - "Intro to workbench 2.0/Introduction.html"
    - "Intro to workbench 2.0/Introduction_files/**"
    - "Intro to workbench 2.0/images/**"

website:
  title: "All of Us Workbench 2.0 Training"
  description: "Training materials from the Yale Cushing/Whitney Medical Library for the All of Us Researcher Workbench 2.0"
  site-url: https://cwml.github.io/All-of-Us-Training-Resources/
  repo-url: https://github.com/CWML/All-of-Us-Training-Resources
  search: true
  page-navigation: true

  navbar:
    collapse-below: xl   # hamburger menu below 1200px, so the title isn't squeezed
    left:
      - text: "Home"
        href: index.qmd
      - text: "Get Started"
        href: pages/get-started/about.qmd
      - text: "Your Workspace"
        href: pages/workspace/workspaces.qmd
      - text: "Data"
        href: pages/data/data-collections.qmd
      - text: "Courses"
        menu:
          - text: "All courses"
            href: pages/courses/index.qmd
          - text: "Omics series"
            href: pages/courses/omics/index.qmd
      - text: "Learn by Example"
        href: pages/examples/tutorial-workspaces.qmd
      - text: "Optional Extras"
        href: pages/extras/extras.qmd
      - text: "Resources"
        href: pages/resources.qmd
    right:
      - icon: envelope
        text: "Feedback"
        href: "mailto:maximilian.wegener@yale.edu?subject=All%20of%20Us%20training%20site%20feedback"
      - icon: github
        href: https://github.com/CWML/All-of-Us-Training-Resources
        aria-label: "Source code on GitHub"

  sidebar:
    - id: get-started
      title: "Get Started"
      style: docked
      contents:
        - pages/get-started/about.qmd
        - pages/get-started/whats-new.qmd
        - pages/get-started/access.qmd
        - pages/get-started/billing.qmd
    - id: workspace
      title: "Your Workspace"
      style: docked
      contents:
        - pages/workspace/workspaces.qmd
        - pages/workspace/setup.qmd
        - pages/workspace/research-use-statement.qmd
        - pages/workspace/resources.qmd
        - pages/workspace/apps.qmd
        - pages/workspace/storage-costs.qmd
        - pages/workspace/workflows.qmd
    - id: data
      title: "Data"
      style: docked
      contents:
        - pages/data/data-collections.qmd
        - pages/data/data-explorer.qmd
    - id: examples
      title: "Learn by Example"
      style: docked
      contents:
        - pages/examples/tutorial-workspaces.qmd
        - pages/examples/notebooks.qmd
    - id: courses
      title: "Courses"
      style: docked
      contents:
        - pages/courses/index.qmd
        - section: "Omics"
          contents:
            - pages/courses/omics/index.qmd
            - pages/courses/omics/omics-for-beginners.qmd
            - pages/courses/omics/4-1-dna-intro.qmd
            - pages/courses/omics/4-2-gwas-plink.qmd
            - pages/courses/omics/4-3-gwas-hail.qmd
            - pages/courses/omics/4-4-phewas.qmd
            - pages/courses/omics/4-5-rnaseq.qmd
            - pages/courses/omics/4-6-proteomics.qmd
            - pages/courses/omics/4-7-rnaseq-proteomics.qmd
    - id: extras
      title: "Optional Extras"
      style: docked
      contents:
        - pages/extras/extras.qmd
        - pages/extras/github-guide.qmd

  page-footer:
    left: "Cushing/Whitney Medical Library, Yale School of Medicine"
    center: "Questions or feedback? Email [maximilian.wegener@yale.edu](mailto:maximilian.wegener@yale.edu?subject=All%20of%20Us%20training%20site%20feedback)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-title: "On this page"
